<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Týdenní přehled</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="components.css" />
  <style>
    /* Lokální :root smazán 2026-09-15 — všechny hodnoty přesně odpovídaly
       theme.css beze změny (jen jiné jméno u --person/--weekend/--blue/
       --blue-dark/--orange), na rozdíl od ostatních souborů TOP tady
       nebylo potřeba nic schvalovat ani sjednocovat. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button, input, select, textarea { font-family: inherit; }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--navy-800);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .topbar h1 {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text-on-navy-muted);
      text-transform: uppercase;
      margin-right: 4px;
    }
    .week-info {
      font-size: 13px;
      font-weight: 700;
      color: white;
    }
    .week-info small {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-on-navy-muted);
      margin-left: 6px;
    }
    /* Topbar je trvale tmavý chrome nezávisle na režimu appky — #64748b a
       #334155 dřív neměly v theme.css invariantní ekvivalent (na rozdíl
       od #cbd5e1/#94a3b8/#475569 použitých jinde v topbaru) — 2026-09-15
       doplněny nové invariantní --chrome-muted/--chrome-border právě
       pro tenhle případ (viz theme.css v1.4.0), takže teď jdou i tyhle
       převést na proměnnou, ne zůstat doslovně. */
    .sync-status {
      font-size: 11px;
      color: var(--chrome-muted);
      margin-left: auto;
    }
    .topbar button {
      border: 1px solid var(--chrome-border);
      background: transparent;
      color: var(--text-on-navy-faint);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .topbar button:hover { background: var(--navy-700); color: white; }
    .topbar button.primary {
      font-family: var(--font-heading);
      background: var(--brand-accent);
      border-color: var(--brand-accent);
      color: var(--brand-accent-ink);
    }
    .topbar a.back-link {
      font-size: 11px;
      color: var(--chrome-muted);
      text-decoration: none;
      border: 1px solid var(--chrome-border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .topbar a.back-link:hover { color: white; border-color: var(--chrome-muted); }

    /* ── DUAL SCHEDULE AREA ── */
    .schedule-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      overflow: hidden;
      min-height: 0;
    }
    .week-block {
      background: white;
      border-radius: 10px;
      border: 1px solid var(--line-medium);
      overflow: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .week-block-title {
      font-family: var(--font-heading);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      background: var(--navy-800);
      color: var(--chrome-muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .schedule {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(72px, 100px) repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, 0.67fr));
      grid-auto-rows: 1fr;
      font-size: clamp(8px, 0.9vw, 11px);
      flex: 1;
      align-content: stretch;
    }

    /* ── GRID CELLS ── */
    .head {
      border-right: 1px solid var(--line);
      border-bottom: 2px solid var(--line);
      height: 40px;
      padding: 0 3px;
      font-weight: 700;
      text-align: center;
      font-size: clamp(7px, 0.85vw, 10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      overflow: hidden;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .head small {
      font-size: clamp(7px, 0.8vw, 10px);
      font-weight: 700;
      opacity: .8;
    }
    .head.blank { background: white; }
    .head.d0 { background: var(--accent-pale-dark); }
    .head.d1 { background: var(--accent-pale); }
    .head.d2 { background: var(--day-wed); }
    .head.d3 { background: var(--day-thu); }
    .head.d4 { background: var(--day-fri); }
    .head.d5, .head.d6 { background: var(--weekend-header-bg); }
    .person {
      background: var(--person-bg);
      border-right: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      padding: 5px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .person .code {
      font-weight: 700;
      font-size: clamp(9px, 1.0vw, 13px);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .person .name {
      line-height: 1.3;
      font-size: clamp(7px, 0.75vw, 10px);
      color: var(--tile-text);
    }
    .cell {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line-medium);
      padding: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .cell.weekend { background: var(--weekend-bg); }

    /* ── TASK CARDS ── */
    .task {
      border: 1px solid rgba(0,0,0,0.15);
      padding: 3px 4px 2px;
      cursor: default;
      font-size: calc(clamp(12px, 1.6vw, 20px) * var(--task-scale, 1));
      line-height: 1.25;
      min-height: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .task.density-2 { font-size: calc(clamp(12px, 1.2vw, 15px) * var(--task-scale, 1)); }
    .task.density-3plus { font-size: calc(clamp(12px, 0.85vw, 13px) * var(--task-scale, 1)); }
    .task .title { margin-bottom: 2px; }
    .task .meta {
      display: flex;
      justify-content: space-between;
      gap: 3px;
      font-size: 0.9em;
      font-weight: 700;
      color: var(--text);
    }
    .task .meta span { min-width: 0; overflow-wrap: break-word; }
    .task.p0 { background: var(--tile-p0); }
    .task.p1 { background: var(--tile-p1); }
    .task.p2 { background: var(--tile-p2); }
    .task.p3 { background: var(--tile-p3); }
    .task.px { background: var(--tile-px); border-left-color: var(--tile-px-border); }
    .task.waiting { background: var(--warn-block); }
    .task.done { background: var(--success-block); color: var(--success-strong); }
    .task.recurring { border-left: 3px solid var(--recurring-border); }
    .task .recurring-icon { font-size: 9px; color: var(--recurring-border); margin-bottom: 1px; }
    .task .danger { color: var(--danger); font-weight: 700; }
    .task .spz { color: var(--danger); font-weight: 700; font-size: 0.9em; margin-top: 1px; }
    .task .multiday-badge { font-size: 9px; color: var(--multiday-icon); font-weight: 700; margin-bottom: 1px; }

    /* ── MODAL ── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-card {
      background: white;
      max-width: 760px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    /* Dlouhá poznámka může kartu roztáhnout přes okraj obrazovky — samostatné
       pravidlo jen pro tenhle modál (ne úprava sdíleného .modal-card), ať se
       neopakuje Nástraha č. 4 (naivní sloučení selektorů). */
    #modal .modal-card { max-height: 88vh; overflow: auto; }

    /* ── Nastavení zobrazení (lidé & sloupce) ── */
    #displaySettingsModal .modal-card { max-width: 480px; max-height: 85vh; overflow: auto; }
    #displaySettingsModal .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: #fff;
    }
    #displaySettingsModal .modal-body { padding: 16px 20px 20px; }
    .person-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line-softer);
    }
    .person-row:last-child { border-bottom: none; }
    .person-row .person-name {
      flex: 1;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .person-row .side-btn {
      width: auto;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid var(--line-medium);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .person-row .side-btn.active-L { background: var(--accent); border-color: var(--accent); color: white; }
    .person-row .side-btn.active-R { background: var(--teal); border-color: var(--teal); color: white; }
    .person-row .move-btn {
      width: auto; padding: 3px 6px; font-size: 12px; border-radius: 4px;
      border: 1px solid var(--line-medium); background: transparent; color: var(--text-muted);
      cursor: pointer; flex-shrink: 0; line-height: 1;
    }
    .person-row .move-btn:hover { color: white; background: var(--text-muted); }
    .person-row .move-btn:disabled { opacity: 0.25; cursor: default; }
    .person-row .hide-btn {
      width: auto; padding: 3px 6px; font-size: 12px; border-radius: 4px;
      border: 1px solid var(--line-medium); background: transparent; color: var(--text-muted);
      cursor: pointer; flex-shrink: 0; line-height: 1; transition: background .15s, color .15s;
    }
    .person-row .hide-btn:hover { background: var(--text-muted); color: white; }
    .person-row.is-hidden .person-name { opacity: 0.4; text-decoration: line-through; }
    .person-row.is-hidden .side-btn { opacity: 0.3; pointer-events: none; }
    .person-row.is-hidden .move-btn { opacity: 0.3; pointer-events: none; }
    .person-row .hide-btn.is-hidden { background: var(--text-faint); color: white; border-color: var(--text-faint); }
    html.dark #displaySettingsModal .modal-card, html.dark #displaySettingsModal .modal-head { background: var(--navy-700); color: var(--text); border-color: var(--line-soft); }
    html.dark .person-row { border-color: var(--line-soft); }
    html.dark .person-row .person-name { color: var(--text); }
    html.dark .person-row .side-btn, html.dark .person-row .move-btn, html.dark .person-row .hide-btn { border-color: var(--border-on-navy); color: var(--text-on-navy-muted); }
    .modal-card header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }
    .modal-card main {
      padding: 20px;
      display: grid;
      gap: 16px;
      font-size: 14px;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: var(--chip-bg);
      color: var(--chip-text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .modal-title { margin: 10px 0 0; font-size: 20px; font-weight: 700; }
    .modal-label { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
    .modal-text { color: var(--prio-p3-text); margin-top: 4px; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0 14px;
      font-size: 10px;
      color: var(--text-on-navy-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .swatch {
      width: 10px; height: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  
    /* ── DARK MODE ── */
    html.dark { color-scheme: dark; }
    html.dark body { background: var(--navy-800); color: var(--text); }
    html.dark .topbar { background: var(--navy-700); border-color: var(--line-soft); }

    .fab-nav {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      width: auto;
      padding: 14px 18px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: var(--navy-800);
      color: var(--panel);
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.28);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .fab-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.34);
      background: var(--navy-hover);
    }
    .fab-nav .fab-sub {
      display: block;
      font-size: 11px;
      font-weight: 500;
      opacity: .8;
      margin-top: 2px;
    }
    .fab-nav .fab-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-size: 16px;
    }
    @media (max-width: 720px) {
      .fab-nav {
        right: 14px;
        bottom: 14px;
        min-width: 0;
        width: calc(100% - 28px);
        justify-content: center;
      }
    }
    /* NOVÉ 2026-09-17 — genuinní mezera nalezená při sjednocování Správy
       úkolů (viz CLAUDE.md): tenhle soubor má stejné .fab-nav jako
       Dashboard (background: var(--navy-800); color: var(--panel)), ale
       chyběl mu Dashboardův html.dark přepis. V tmavém režimu je
       --panel tmavá (#1e293b) na stejně tmavém --navy-800 (#262421) —
       text tlačítka "Dovolené (SPA)" byl prakticky nečitelný. */
    html.dark .fab-nav { background: var(--navy-700); color: var(--text); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    html.dark button, html.dark select, html.dark input { background: var(--navy-700); color: var(--text); border-color: var(--line-soft); }
    html.dark .schedule { background: var(--navy-800); }
    html.dark .head { background: var(--navy-700); color: var(--text-on-navy-muted); border-color: var(--line-soft); }
    html.dark .head.weekend { background: var(--navy-600); }
    html.dark .person { background: var(--navy-700); color: var(--text-on-navy-muted); border-color: var(--line-soft); }
    html.dark .cell { background: var(--navy-800); border-color: var(--navy-700); }
    html.dark .cell.weekend { background: var(--weekend-bg); }
    html.dark .task { background: var(--navy-700); border-color: var(--line-soft); color: var(--text); }
    html.dark .task.p0 { background: var(--tile-p0); border-left-color: var(--tile-p0-border); }
    html.dark .task.p1 { background: var(--tile-p1); border-left-color: var(--tile-p1-border); }
    html.dark .task.p2 { background: var(--tile-p2); border-left-color: var(--tile-p2-border); }
    html.dark .task.p3 { background: var(--tile-p3); border-left-color: var(--tile-p3-border); }
    html.dark .task.px { background: var(--tile-px); border-left-color: var(--tile-px-border); }
    html.dark .task.done { background: var(--success-block); color: var(--success-strong); opacity: 0.75; }
    html.dark .task .title { color: var(--text); }
    html.dark .task .meta { color: var(--text-faint); }
    html.dark .task .spz { color: var(--danger-block); }
    html.dark .task .multiday-badge { color: var(--multiday-icon); }
    html.dark .task.recurring { border-left-color: var(--recurring-border); }
    html.dark .modal { background: rgba(0,0,0,0.75); }
    html.dark .modal-card { background: var(--navy-700); color: var(--text); }
    html.dark .modal-card header { border-color: var(--line-soft); }
    html.dark .chip { background: var(--chip-bg); color: var(--chip-text); }
    html.dark .modal-title { color: var(--text); }
    html.dark .modal-label { color: var(--text-on-navy-muted); }
    html.dark .modal-text { color: var(--text-on-navy-muted); }
    html.dark #syncStatus { color: var(--text-faint); }
    html.dark .legend { color: var(--text-faint); }

    </style>
</head>
<body>

<div class="topbar">
  <h1>FT Přehled</h1>
  <div class="week-info">
    <span id="weekTitle">Týden</span>
    <small id="weekSubtitle"></small>
  </div>
  <button id="prevWeek">← Předchozí</button>
  <button id="nextWeek">Další →</button>
  <button id="todayBtn">Dnes</button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);white-space:nowrap;">
      Text
      <input id="taskScaleSlider" type="range" min="50" max="150" value="100" step="5" style="width:100px;" />
      <span id="taskScaleValue" style="font-weight:700;min-width:38px;">100 %</span>
    </label>
    <button id="displaySettingsBtn" onclick="openDisplaySettingsModal()" style="font-size:13px;padding:6px 12px;white-space:nowrap;">⚙️ Nastavení zobrazení</button>
    <a href="tydenni_prehled_mobile.html" style="font-size:12px;padding:4px 10px;white-space:nowrap;text-decoration:none;border:1px solid var(--chrome-border);border-radius:6px;display:inline-flex;align-items:center;background:transparent;color:var(--text-on-navy-faint);" title="Přepnout na mobilní verzi">📱 Mobilní verze</a>
    <button id="darkModeBtn" class="dark-mode-btn" onclick="applyDarkMode(!document.documentElement.classList.contains('dark'))" style="font-size:16px;padding:6px 12px;" title="Tmavý režim">🌙</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="swatch" style="background:var(--tile-p0)"></div>P0</div>
    <div class="legend-item"><div class="swatch" style="background:var(--tile-p1)"></div>P1</div>
    <div class="legend-item"><div class="swatch" style="background:var(--tile-p2)"></div>P2</div>
    <div class="legend-item"><div class="swatch" style="background:var(--tile-p3)"></div>P3</div>
    <div class="legend-item"><div class="swatch" style="background:var(--tile-px)"></div>PX</div>
    <div class="legend-item"><div class="swatch" style="background:var(--warn-block)"></div>Čeká</div>
    <div class="legend-item"><div class="swatch" style="background:var(--success-block)"></div>Hotovo</div>
  </div>
  <span class="sync-status" id="syncStatus"></span>
  <a class="back-link" href="tydenni_dashboard_live_reload_local_linked.html">⚙ Dashboard</a>
</div>

<div class="schedule-area">
  <div class="week-block">
    <div class="week-block-title" id="labelL">LEVÝ SLOUPEC</div>
    <div class="schedule" id="scheduleL"></div>
  </div>
  <div class="week-block">
    <div class="week-block-title" id="labelR">PRAVÝ SLOUPEC</div>
    <div class="schedule" id="scheduleR"></div>
  </div>
</div>

<script>
// ── Dark mode ──────────────────────────────────────────────────────────
const DARK_KEY = "ft_darkMode";
function applyDarkMode(dark) {
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem(DARK_KEY, dark ? "1" : "0");
  document.querySelectorAll(".dark-mode-btn").forEach(btn => {
    btn.textContent = dark ? "☀️" : "🌙";
    btn.title = dark ? "Světlý režim" : "Tmavý režim";
  });
}
function initDarkMode() {
  const saved = localStorage.getItem(DARK_KEY);
  const dark = saved !== null ? saved === "1" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyDarkMode(dark);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    if (localStorage.getItem(DARK_KEY) === null) applyDarkMode(e.matches);
  });
}
initDarkMode();

// ── Velikost textu v dlaždicích (jen tato stránka) ─────────────────────
const TASK_SCALE_KEY = "ftPrehledTaskFontScale";
function applyTaskScale(percent) {
  const scale = percent / 100;
  document.documentElement.style.setProperty("--task-scale", scale);
  localStorage.setItem(TASK_SCALE_KEY, String(percent));
  const slider = document.getElementById("taskScaleSlider");
  const label = document.getElementById("taskScaleValue");
  if (slider) slider.value = percent;
  if (label) label.textContent = percent + " %";

  // Vyčisti dřívější inline přebití (z automatického zmenšování dlouhého textu)
  // a znovu zkontroluj přetečení s novým měřítkem
  document.querySelectorAll(".task").forEach(t => { t.style.fontSize = ""; });
  if (typeof fitTaskText === "function") {
    requestAnimationFrame(() => {
      document.querySelectorAll(".task").forEach(fitTaskText);
    });
  }
}
function initTaskScale() {
  const saved = parseInt(localStorage.getItem(TASK_SCALE_KEY), 10);
  applyTaskScale(!isNaN(saved) ? saved : 100);
  const slider = document.getElementById("taskScaleSlider");
  if (slider) slider.addEventListener("input", () => applyTaskScale(parseInt(slider.value, 10)));
}
document.addEventListener("DOMContentLoaded", initTaskScale);
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="ft_loader.js"></script>
<script>
const FALLBACK_DATA = {"tasks": [], "backlog": [], "owners": [], "resitele": [], "generatedAt": null};


let PEOPLE_LABELS = {};

function buildPeopleLabels(resitele) {
  PEOPLE_LABELS = {};
  (resitele || []).forEach(r => {
    PEOPLE_LABELS[r.zkratka] = `${r.jmeno} ${r.prijmeni}`.trim();
  });
}

const XLSX_FILE = "0_SEZNAM_UKOLU-GLOBAL.xlsx";
const LOCAL_WATCH_INTERVAL_MS = 5000;
const STORAGE_KEY = "ftDashboardPeopleLayout";

let DATA = JSON.parse(JSON.stringify(FALLBACK_DATA));


// ── STATE ──
// ── Perzistence vybraného týdne ─────────────────────────────────────────
const WEEK_STATE_KEY = "ftPrehledWeekState";

function loadSavedWeek() {
  try {
    const saved = localStorage.getItem(WEEK_STATE_KEY);
    return saved ? new Date(saved + "T00:00:00") : null;
  } catch(e) { return null; }
}

function saveWeekState() {
  try { localStorage.setItem(WEEK_STATE_KEY, toISO(state.weekStart)); } catch(e) {}
}

const _savedWeek = loadSavedWeek();

const state = {
  weekStart: _savedWeek ? getWeekStart(_savedWeek) : getWeekStart(new Date())
};

// ── PEOPLE LAYOUT from localStorage (shared with main dashboard) ──
// Výchozí rozložení lidí — použije se jen když ještě není v localStorage nic uloženo
// (stejná šablona jako v dashboardu, aby noví uživatelé viděli konzistentní výchozí stav
// bez ohledu na to, kterou stránku otevřou jako první).
const DEFAULT_PEOPLE_LAYOUT = [
  { owner: "RS",  side: "L" },
  { owner: "LR",  side: "L" },
  { owner: "DH",  side: "L" },
  { owner: "MiH", side: "L" },
  { owner: "MK",  side: "L" },
  { owner: "AMa", side: "L" },
  { owner: "MŽ",  side: "R" },
  { owner: "PL",  side: "R" },
  { owner: "JuM", side: "R" },
  { owner: "JoP", side: "R" },
  { owner: "SP",  side: "R" },
  { owner: "NP",  side: "R" },
  { owner: "MM",  side: "R" },
  { owner: "JN",  side: "R", hidden: true },
  { owner: "JK",  side: "R", hidden: true },
  { owner: "FT",  side: "R", hidden: true },
  { owner: "FCH", side: "L" },
];

function getPeopleLayout() {
  // Aktivní řešitelé = ti bez příznaku vyrazen. Vyřazení se do Přehledu
  // nezahrnují vůbec — to je oddělené od osobního skrýt/zobrazit níže.
  const activeZkratky = (DATA.resitele && DATA.resitele.length > 0)
    ? DATA.resitele.filter(r => !r.vyrazen).map(r => r.zkratka)
    : DATA.owners;

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved && Array.isArray(saved) && saved.length > 0) {
      const seen = new Set();
      return saved.filter(e => {
        if (seen.has(e.owner)) return false;
        seen.add(e.owner);
        return activeZkratky.includes(e.owner);
      });
    }
  } catch(e) {}
  const defaultOwners = DEFAULT_PEOPLE_LAYOUT.map(e => e.owner);
  const seeded = DEFAULT_PEOPLE_LAYOUT.filter(e => activeZkratky.includes(e.owner)).map(e => ({...e}));
  const missing = activeZkratky.filter(o => !defaultOwners.includes(o));
  missing.forEach((o, i) => {
    seeded.push({ owner: o, side: i < Math.ceil(missing.length / 2) ? "L" : "R" });
  });
  return seeded;
}

function savePeopleLayoutPrehled(layout) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(layout)); } catch(e) {}
}

function resetPeopleLayoutToDefault() {
  if (!confirm("Opravdu obnovit tovární nastavení? Vlastní pořadí, strany i skrytí lidí se ztratí.")) return;
  const owners = (DATA.resitele && DATA.resitele.length > 0)
    ? DATA.resitele.filter(r => !r.vyrazen).map(r => r.zkratka)
    : (DATA.owners || []);
  const defaultOwners = DEFAULT_PEOPLE_LAYOUT.map(e => e.owner);
  const seeded = DEFAULT_PEOPLE_LAYOUT.filter(e => owners.includes(e.owner)).map(e => ({...e}));
  const missing = owners.filter(o => !defaultOwners.includes(o));
  missing.forEach((o, i) => {
    seeded.push({ owner: o, side: i < Math.ceil(missing.length / 2) ? "L" : "R" });
  });
  savePeopleLayoutPrehled(seeded);
  buildPeopleFiltersPrehled();
  render();
}

function openDisplaySettingsModal() {
  buildPeopleFiltersPrehled();
  document.getElementById("displaySettingsModal").classList.add("open");
}

function closeDisplaySettingsModal() {
  document.getElementById("displaySettingsModal").classList.remove("open");
}

function buildPeopleFiltersPrehled() {
  const wrap = document.getElementById("peopleFiltersPrehled");
  if (!wrap) return;
  const layout = getPeopleLayout();
  wrap.innerHTML = "";

  layout.forEach((entry, idx) => {
    const { owner, side, hidden } = entry;
    const label = PEOPLE_LABELS[owner] || owner;
    const sideOwners = layout.filter(e => e.side === side);
    const posInSide = sideOwners.indexOf(entry);

    const row = document.createElement("div");
    row.className = "person-row" + (hidden ? " is-hidden" : "");

    const upBtn = document.createElement("button");
    upBtn.className = "move-btn";
    upBtn.textContent = "↑";
    upBtn.disabled = posInSide === 0;
    upBtn.title = "Posunout výše";
    upBtn.addEventListener("click", () => {
      const prevIdx = layout.slice(0, idx).map((e,i)=>({e,i})).filter(x=>x.e.side===side).pop();
      if (prevIdx !== undefined) {
        [layout[idx], layout[prevIdx.i]] = [layout[prevIdx.i], layout[idx]];
        savePeopleLayoutPrehled(layout);
        buildPeopleFiltersPrehled();
        render();
      }
    });

    const downBtn = document.createElement("button");
    downBtn.className = "move-btn";
    downBtn.textContent = "↓";
    downBtn.disabled = posInSide === sideOwners.length - 1;
    downBtn.title = "Posunout níže";
    downBtn.addEventListener("click", () => {
      const nextIdx = layout.slice(idx+1).map((e,i)=>({e,i:i+idx+1})).filter(x=>x.e.side===side).shift();
      if (nextIdx !== undefined) {
        [layout[idx], layout[nextIdx.i]] = [layout[nextIdx.i], layout[idx]];
        savePeopleLayoutPrehled(layout);
        buildPeopleFiltersPrehled();
        render();
      }
    });

    const nameSpan = document.createElement("span");
    nameSpan.className = "person-name";
    nameSpan.title = label;
    nameSpan.textContent = `${owner} – ${label}`;

    const lBtn = document.createElement("button");
    lBtn.className = `side-btn ${side === "L" ? "active-L" : ""}`;
    lBtn.textContent = "L";
    lBtn.title = "Levý sloupec";
    lBtn.addEventListener("click", () => {
      layout[idx].side = "L";
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      render();
    });

    const rBtn = document.createElement("button");
    rBtn.className = `side-btn ${side === "R" ? "active-R" : ""}`;
    rBtn.textContent = "P";
    rBtn.title = "Pravý sloupec";
    rBtn.addEventListener("click", () => {
      layout[idx].side = "R";
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      render();
    });

    const hideBtn = document.createElement("button");
    hideBtn.className = "hide-btn" + (hidden ? " is-hidden" : "");
    hideBtn.textContent = hidden ? "🚫" : "👁";
    hideBtn.title = hidden ? "Zobrazit řádek" : "Skrýt řádek";
    hideBtn.addEventListener("click", () => {
      layout[idx].hidden = !layout[idx].hidden;
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      render();
    });

    row.appendChild(upBtn);
    row.appendChild(downBtn);
    row.appendChild(nameSpan);
    row.appendChild(lBtn);
    row.appendChild(rBtn);
    row.appendChild(hideBtn);
    wrap.appendChild(row);
  });
}

// ── DATE HELPERS ──
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function toISO(date) { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(date) {
  return new Intl.DateTimeFormat("cs-CZ", { day: "2-digit", month: "2-digit", year: "numeric" }).format(date);
}
function fmtDayLabel(date) {
  return new Intl.DateTimeFormat("cs-CZ", { weekday: "long" }).format(date).toUpperCase();
}
function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

// ── CARD CLASS ──
function cardClass(task) {
  const parts = ["task", (task.priority || "P3").toLowerCase()];
  if (task.waiting) parts.push("waiting");
  if (String(task.state || "").toLowerCase().includes("dokončeno")) parts.push("done");
  if (task.recurring) parts.push("recurring");
  return parts.join(" ");
}

// ── RENDER ONE SIDE ──
function renderSide(targetEl, side) {
  const layout = getPeopleLayout();
  const dates = Array.from({length: 7}, (_, i) => addDays(state.weekStart, i));
  const start = toISO(state.weekStart);
  const end = toISO(addDays(state.weekStart, 6));

  const weekTasks = DATA.tasks.filter(t =>
    t.plannedDate && t.plannedDate >= start && t.plannedDate <= end
  );

  const byOwnerDate = new Map();
  weekTasks.forEach(t => {
    const key = `${t.owner}|${t.plannedDate}`;
    if (!byOwnerDate.has(key)) byOwnerDate.set(key, []);
    byOwnerDate.get(key).push(t);
  });

  const validOwners = (DATA.resitele && DATA.resitele.length > 0)
    ? new Set(DATA.resitele.map(r => r.zkratka))
    : new Set(DATA.owners || []);

  const people = layout.filter(e => e.side === side && !e.hidden).map(e => e.owner)
    .filter(o => validOwners.has(o));

  targetEl.innerHTML = "";

  if (!people.length) {
    targetEl.innerHTML = `<div style="padding:12px;color:var(--text-muted);font-size:11px;">Žádní lidé v tomto sloupci.<br>Nastavte v hlavním dashboardu.</div>`;
    return;
  }

  // Set grid rows: fixed header + equal rows for each person
  targetEl.style.gridTemplateRows = `40px repeat(${people.length}, 1fr)`;

  // Header row
  const blank = document.createElement("div");
  blank.className = "head blank";
  targetEl.appendChild(blank);
  dates.forEach((d, idx) => {
    const h = document.createElement("div");
    h.className = `head d${idx}`;
    h.innerHTML = `${fmtDayLabel(d)} <small>${fmtDate(d)}</small>`;
    targetEl.appendChild(h);
  });

  // Person rows
  people.forEach(person => {
    const personCell = document.createElement("div");
    personCell.className = "person";
    const label = PEOPLE_LABELS[person] || person;
    personCell.innerHTML = `<div><div class="code">${escapeHtml(person)}</div><div class="name">${escapeHtml(label)}</div></div>`;
    targetEl.appendChild(personCell);

    dates.forEach((d, idx) => {
      const c = document.createElement("div");
      c.className = `cell ${idx >= 5 ? "weekend" : ""}`;
      const items = (byOwnerDate.get(`${person}|${toISO(d)}`) || [])
        .sort((a,b) => (a.priority||"").localeCompare(b.priority||""));
      const densityClass = items.length >= 3 ? " density-3plus" : items.length === 2 ? " density-2" : "";
      items.forEach(task => {
        const div = document.createElement("div");
        div.className = cardClass(task) + densityClass;
        div.style.cursor = "pointer";
        div.innerHTML = `${task.recurring ? '<div class="recurring-icon">🔁 opakující se</div>' : ""}${task.isMultiDay ? `<div class="multiday-badge">📅 ${task.multiDayIndex}/${task.multiDayTotal}</div>` : ""}<div class="title">${escapeHtml(task.title)}</div>
          <div class="meta">
            <span class="${(task.project||"").toLowerCase().includes("ford") ? "danger" : ""}">${escapeHtml(task.project||"")}</span>
          </div>${task.auto ? `<div class="spz">🚗 ${escapeHtml(task.auto)}</div>` : ""}`;
        div.addEventListener("click", () => openModal(task));
        c.appendChild(div);
      });
      targetEl.appendChild(c);
    });
  });

  fitAllTaskText(targetEl);
}

// ── Zmenší písmo jednotlivé kartičky, pokud text přetéká, dokud se nevejde ──
function escapeHtml(str) {
  return (str ?? "").toString()
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function fitTaskText(el) {
  const minFontSize = 6;
  let fontSize = parseFloat(getComputedStyle(el).fontSize);
  el.style.fontSize = fontSize + "px";
  let guard = 0;
  while (el.scrollHeight > el.clientHeight + 1 && fontSize > minFontSize && guard < 60) {
    fontSize -= 0.5;
    el.style.fontSize = fontSize + "px";
    guard++;
  }
}

function fitAllTaskText(containerEl) {
  requestAnimationFrame(() => {
    containerEl.querySelectorAll(".task").forEach(fitTaskText);
  });
}

// ── RENDER ──
function render() {
  const weekNo = getWeekNumber(state.weekStart);
  const end = addDays(state.weekStart, 6);
  document.getElementById("weekTitle").textContent = `Týden ${weekNo}`;
  document.getElementById("weekSubtitle").textContent = `${fmtDate(state.weekStart)} – ${fmtDate(end)}`;
  const label = `TÝDEN ${weekNo}  ·  ${fmtDate(state.weekStart)} – ${fmtDate(end)}`;
  document.getElementById("labelL").textContent = label;
  document.getElementById("labelR").textContent = label;
  renderSide(document.getElementById("scheduleL"), "L");
  renderSide(document.getElementById("scheduleR"), "R");
}

// ── FTLoader integration ──
function setSyncStatus(msg, isError = false) {
  const el = document.getElementById("syncStatus");
  el.textContent = msg;
  el.style.color = isError ? "var(--danger)" : "";
}

let _canMarkDone = false;
let _permissionCheckedPrehled = false;

FTLoader.init({
  onData: (parsedData) => {
    DATA = parsedData;
    DATA.resitele = DATA.resitele || [];
    DATA.owners   = DATA.owners   || [];
    DATA.tasks    = DATA.tasks    || [];
    buildPeopleLabels(DATA.resitele);
    DATA.owners.forEach(o => { if (!PEOPLE_LABELS[o]) PEOPLE_LABELS[o] = o; });
    render();
    if (!_permissionCheckedPrehled) {
      _permissionCheckedPrehled = true;
      // Tlačítko Hotovo v Přehledu je určené VÝHRADNĚ pro roli Operátor — Plánovač
      // má na tohle Dashboard a Správu úkolů, takže tady vidí přehled beze změny.
      if (FTLoader.getUserRole() === "operator") {
        FTLoader.canMarkDone().then(can => { _canMarkDone = can; });
      }
    }
  },
  onStatus: (msg, isError) => { setSyncStatus(msg, isError || false); }
});

// ── EVENTS ──
document.getElementById("prevWeek").addEventListener("click", () => {
  state.weekStart = addDays(state.weekStart, -7); saveWeekState(); render();
});
document.getElementById("nextWeek").addEventListener("click", () => {
  state.weekStart = addDays(state.weekStart, 7); saveWeekState(); render();
});
document.getElementById("todayBtn").addEventListener("click", () => {
  state.weekStart = getWeekStart(new Date()); saveWeekState(); render();
});

// ── INIT ──
render();

// ── MODAL ──
function openModal(task) {
  const chips = [
    task.priority || "Bez priority",
    task.owner || "Bez řešitele",
    task.project || "Bez projektu",
    task.plannedDate ? `Plán: ${task.plannedDate}` : "Bez data",
    task.state || "Bez stavu"
  ];
  if (task.auto) chips.push(`🚗 ${task.auto}`);
  if (task.recurring) chips.push("🔁 Opakující se");
  if (task.isMultiDay) chips.push(`📅 Den ${task.multiDayIndex}/${task.multiDayTotal}`);
  document.getElementById("modalChips").innerHTML = chips.map(ch => `<span class="chip">${escapeHtml(String(ch))}</span>`).join("");
  document.getElementById("modalTitle").textContent = `${task.id || ""} ${task.title || ""}`.trim();
  document.getElementById("modalNote").textContent = task.note || "Bez doplňující poznámky";

  const doneBtn = document.getElementById("modalDoneBtn");
  const isAlreadyDone = (task.state || "").toLowerCase().includes("dokončeno");
  if (_canMarkDone && task.id && !isAlreadyDone) {
    doneBtn.dataset.taskId = task.id;
    doneBtn.dataset.plannedDate = task.plannedDate || "";
    doneBtn.dataset.recurring = task.recurring ? "1" : "";
    doneBtn.dataset.multiDay = task.isMultiDay ? "1" : "";
    doneBtn.style.display = "inline-block";
  } else {
    doneBtn.style.display = "none";
  }

  document.getElementById("modal").classList.add("open");
}

async function markTaskAsDoneFromModal() {
  const btn = document.getElementById("modalDoneBtn");
  const id = btn.dataset.taskId;
  const plannedDate = btn.dataset.plannedDate;
  const isRecurring = btn.dataset.recurring === "1";
  const isMultiDay = btn.dataset.multiDay === "1";
  if (!id) return;
  btn.disabled = true;
  btn.textContent = "Ukládám…";
  try {
    const raw = FTLoader.getRawJson();
    if (!raw) throw new Error("Data ještě nejsou načtena, zkus to za chvíli znovu.");
    const user = FTLoader.getCurrentUser() || "přehled";
    // Hledat jen podle id nestačí: víc raw záznamů může mít STEJNÉ id (víc
    // zástupů za stejné pravidlo v různých obdobích, nebo jeden vícedenní
    // zástup) — FTLoader.findRawTaskForOccurrence vybere ten, jehož skutečný
    // rozsah dní klikaný den opravdu obsahuje (oprava 2026-09-17, nález č. 6).
    const task = FTLoader.findRawTaskForOccurrence(raw.tasks, id, plannedDate);

    if (isRecurring && !task) {
      raw.dokonceni = raw.dokonceni || [];
      const already = raw.dokonceni.find(d => d.id === id && d.datum === plannedDate);
      if (!already) {
        raw.dokonceni.push({ id, datum: plannedDate, zaznamenoKym: user, zaznamenoKdy: toISO(new Date()) });
      }
      await FTLoader.saveToGitHub(raw, `Dokončení ${id} (${plannedDate}) zaznamenáno uživatelem ${user}`);
    } else if (task && isMultiDay) {
      task.completedDays = Array.isArray(task.completedDays) ? task.completedDays : [];
      if (plannedDate && !task.completedDays.includes(plannedDate)) task.completedDays.push(plannedDate);
      if (FTLoader.isMultiDayTaskFullyComplete(task)) {
        task.state = "Dokončeno";
        if (!task.doneDate) task.doneDate = toISO(new Date());
      }
      task.lastUpdated = toISO(new Date());
      await FTLoader.saveToGitHub(raw, `Den ${plannedDate} úkolu ${id} označen jako hotový uživatelem ${user}`);
    } else if (task) {
      task.state = "Dokončeno";
      if (!task.doneDate) task.doneDate = toISO(new Date());
      task.lastUpdated = toISO(new Date());
      await FTLoader.saveToGitHub(raw, `Úkol ${id} označen jako hotový uživatelem ${user}`);
    } else {
      throw new Error(`Úkol ${id} nebyl v databázi nalezen.`);
    }

    document.getElementById("modal").classList.remove("open");
    await FTLoader.reload();
  } catch (e) {
    if (e.message && e.message.includes("CONFLICT")) {
      if (confirm(`⚠ ${e.message}\n\nKliknout OK pro přenačtení dat.`)) {
        await FTLoader.reload();
      }
    } else {
      alert(`Uložení se nepodařilo: ${e.message}`);
      console.error(e);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "✓ Hotovo";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("closeModal").addEventListener("click", () => {
    document.getElementById("modal").classList.remove("open");
  });
  document.getElementById("modalDoneBtn").addEventListener("click", () => markTaskAsDoneFromModal());
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target === document.getElementById("modal"))
      document.getElementById("modal").classList.remove("open");
  });
});

</script>

        <button id="closeModal" style="width:auto;padding:10px 16px;border:1px solid var(--line-medium);border-radius:10px;background:var(--panel);cursor:pointer;font-size:13px;">Zavřít</button>

<div class="modal" id="displaySettingsModal">

    <div class="modal-head">
      <h2 style="margin:0;font-size:18px;">Nastavení zobrazení</h2>
