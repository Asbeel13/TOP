<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TOP — Mobilní dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="components.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    /* Formulářové prvky nedědí font z body automaticky (UA výchozí
       chování) — bez tohohle by tlačítka/inputy zůstala na systémovém
       fontu i po zapojení Work Sans. */
    button, input, select, textarea { font-family: inherit; }
    body {
      min-height: 100vh; /* záloha pro starší prohlížeče */
      min-height: 100dvh; /* na iOS/WebKitu správně zohledňuje schovávající se lištu */
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--navy-800);
      color: white;
      padding: 10px 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .topbar h1 {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text-on-navy-muted);
      text-transform: uppercase;
    }
    .topbar-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 15px;
      cursor: pointer;
      min-width: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:active { background: rgba(255,255,255,0.25); }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .day-nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .day-nav-btn:active { background: rgba(255,255,255,0.3); }
    .day-label {
      flex: 1;
      text-align: center;
    }
    .day-label .day-name {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: white;
    }
    .day-label .day-date {
      font-size: 12px;
      color: var(--text-on-navy-muted);
      margin-top: 2px;
    }
    .today-btn {
      font-family: var(--font-heading);
      background: var(--brand-accent);
      border: none;
      color: var(--brand-accent-ink);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      width: 100%;
      cursor: pointer;
    }

    /* ── Plovoucí tlačítko + (nový úkol) ── */
    .fab-add {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--brand-accent);
      color: var(--brand-accent-ink);
      border: none;
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(255, 89, 20, 0.45);
      cursor: pointer;
    }
    .fab-add:active { background: color-mix(in srgb, var(--brand-accent) 85%, black); }

    /* ── OBSAH ──
       .person-block/.person-head/.avatar/.task-card/.priority-tag/
       .meta-tag teď dodává components.css (zapojeno 2026-09-15, firemní
       redesign) — tady zůstává jen layout specifický pro tuhle stránku. */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .empty-day {
      padding: 14px;
      color: var(--text-faint);
      font-size: 13px;
      text-align: center;
    }

    /* ── MODAL DETAILU (celá šířka na mobilu) ── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      display: none;
      z-index: 200;
    }
    .modal.open { display: flex; align-items: flex-end; }
    .modal-card {
      background: var(--panel);
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    }
    .modal-card header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      background: var(--chip-bg);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--chip-text);
    }
    .modal-title { font-size: 17px; font-weight: 700; line-height: 1.35; }
    .modal-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; margin-top: 12px; }
    .modal-text { font-size: 14px; white-space: pre-wrap; }
    #closeModal {
      flex-shrink: 0;
      border: 1px solid var(--line-medium);
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      min-height: 40px;
    }
    #modalDoneBtn {
      display: none;
      flex-shrink: 0;
      border: 1px solid var(--success-block);
      background: var(--success-soft);
      color: var(--success-strong);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }
    html.dark #modalDoneBtn { border-color: var(--success-soft-border); }
    #modalEditBtn {
      flex-shrink: 0;
      border: 1px solid var(--accent-block-border);
      background: var(--accent-soft);
      color: var(--accent-block-text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }
    #modalCancelBtn {
      flex-shrink: 0;
      border: 1px solid var(--danger-block-border);
      background: var(--cancelled-bg);
      color: var(--danger-block-text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }
    .modal-actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    /* ── Formulářová pole (nový/upravovaný úkol) ── */
    .mform-field { margin-bottom: 12px; }
    .mform-field label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
      font-weight: 700;
    }
    .mform-field input,
    .mform-field select,
    .mform-field textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--line-medium);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
    }
    .mform-field textarea { min-height: 70px; resize: vertical; }
    html.dark .mform-field input,
    html.dark .mform-field select,
    html.dark .mform-field textarea {
      background: var(--bg); border-color: var(--line-soft);
    }
    .mform-save-btn {
      font-family: var(--font-heading);
      width: 100%;
      background: var(--brand-accent);
      color: var(--brand-accent-ink);
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      min-height: 46px;
    }
    .mform-save-btn:disabled { opacity: .6; }

    /* ── NASTAVENÍ ZOBRAZENÍ ── */
    #displaySettingsModal .modal-card { max-height: 85vh; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-body { }
    .person-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-softer);
    }
    .person-row:last-child { border-bottom: none; }
    .person-row .person-name {
      flex: 1;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .person-row .side-btn {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--line-medium);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 38px;
      min-height: 38px;
    }
    .person-row .side-btn.active-L { background: var(--accent); border-color: var(--accent); color: white; }
    .person-row .side-btn.active-R { background: var(--teal); border-color: var(--teal); color: white; }
    .person-row .move-btn {
      padding: 8px 9px; font-size: 14px; border-radius: 6px;
      border: 1px solid var(--line-medium); background: transparent; color: var(--text-muted);
      cursor: pointer; min-width: 38px; min-height: 38px;
    }
    .person-row .move-btn:disabled { opacity: 0.25; }
    .person-row .hide-btn {
      padding: 8px 9px; font-size: 14px; border-radius: 6px;
      border: 1px solid var(--line-medium); background: transparent; color: var(--text-muted);
      cursor: pointer; min-width: 38px; min-height: 38px;
    }
    .person-row .hide-btn.is-hidden { background: var(--text-faint); color: white; border-color: var(--text-faint); }
    .person-row.is-hidden .person-name { opacity: 0.4; text-decoration: line-through; }

    /* ── TMAVÝ REŽIM ──
       Většina barev se teď přepne automaticky přes theme.css (proměnné
       mají svou tmavou variantu v html.dark tam). Tady zůstávají jen
       přepisy, které se NEDAJÍ odvodit automaticky (viz komentáře).

       .person-block/.person-head přepisy SMAZÁNY 2026-09-15 (firemní
       redesign) — nová verze z components.css používá --panel/
       --line-soft, které mají svou tmavou hodnotu už v theme.css. */
    html.dark #closeModal { background: var(--line-soft); border-color: var(--border-on-navy); }
    html.dark .person-row { border-color: var(--line-soft); }
    html.dark .person-row .side-btn, html.dark .person-row .move-btn, html.dark .person-row .hide-btn { border-color: var(--border-on-navy); color: var(--text-on-navy-muted); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-row1">
      <h1>TOP · Mobilní dashboard</h1>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="openDisplaySettingsModal()" title="Nastavení zobrazení">⚙️</button>
        <button class="icon-btn dark-mode-btn" onclick="applyDarkMode(!document.documentElement.classList.contains('dark'))" title="Tmavý režim">🌙</button>
        <a class="icon-btn" href="tydenni_prehled_mobile.html" title="Přejít na mobilní přehled" style="text-decoration:none;font-size:13px;">📅</a>
      </div>
    </div>
    <div class="day-nav">
      <button class="day-nav-btn" id="prevDayBtn">‹</button>
      <div class="day-label">
        <div class="day-name" id="dayName">—</div>
        <div class="day-date" id="dayDate">—</div>
      </div>
      <button class="day-nav-btn" id="nextDayBtn">›</button>
    </div>
    <button class="today-btn" id="todayBtn">Dnes</button>
  </div>

  <div id="content"></div>

  <button class="fab-add" id="fabAddBtn" title="Nový úkol" aria-label="Založit nový úkol" style="display:none;">+</button>

  <div class="modal" id="modal">
    <div class="modal-card">
      <header>
        <div>
          <div class="chips" id="modalChips"></div>
          <div class="modal-title" id="modalTitle"></div>
        </div>
        <button id="closeModal">Zavřít</button>
      </header>
      <div class="modal-label">Upřesnění</div>
      <div class="modal-text" id="modalNote"></div>
      <div class="modal-actions-row">
        <button id="modalDoneBtn">✓ Hotovo</button>
        <button id="modalEditBtn">✏️ Upravit</button>
        <button id="modalCancelBtn">🗑️ Zrušit</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editTaskModal">
    <div class="modal-card">
      <header>
        <div class="modal-title">Upravit úkol</div>
        <button id="closeEditModal">Zavřít</button>
      </header>
      <div class="mform-field"><label>Název úkolu</label><input id="et_task" /></div>
      <div class="mform-field"><label>Řešitel</label><select id="et_assignee"></select></div>
      <div class="mform-field"><label>Priorita</label>
        <select id="et_priority">
          <option value="P0">P0 – nejvyšší</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
          <option value="P3">P3 – nejnižší</option>
          <option value="PX">PX – volno/lékař</option>
        </select>
      </div>
      <div class="mform-field"><label>Stav</label>
        <select id="et_state">
          <option value="Nový">Nový</option>
          <option value="Probíhá">Probíhá</option>
          <option value="Čeká se">Čeká se</option>
          <option value="Dokončeno">Dokončeno</option>
        </select>
      </div>
      <div class="mform-field"><label>Plánovaný datum realizace</label><input id="et_planned" type="date" /></div>
      <div class="mform-field"><label>Poznámka</label><textarea id="et_note"></textarea></div>
      <button class="mform-save-btn" id="etSaveBtn">Uložit změny</button>
    </div>
  </div>

  <div class="modal" id="newTaskModalMobile">
    <div class="modal-card">
      <header>
        <div class="modal-title">Nový úkol</div>
        <button id="closeNewTaskModalMobile">Zavřít</button>
      </header>
      <div class="mform-field field-required"><label>Úkol</label><input id="nt_task" /></div>
      <div class="mform-field"><label>Řešitel</label><select id="nt_assignee"></select></div>
      <div class="mform-field"><label>Priorita</label>
        <select id="nt_priority">
          <option value="P0">P0 – nejvyšší</option>
          <option value="P1">P1</option>
          <option value="P2" selected>P2</option>
          <option value="P3">P3 – nejnižší</option>
          <option value="PX">PX – volno/lékař</option>
        </select>
      </div>
      <div class="mform-field"><label>Plánovaný datum realizace</label><input id="nt_planned" type="date" /></div>
      <div class="mform-field"><label>Projekt</label><input id="nt_project" /></div>
      <div class="mform-field"><label>Obchodní zástupce</label><input id="nt_sales" /></div>
      <div class="mform-field"><label>Poznámka</label><textarea id="nt_note"></textarea></div>
      <button class="mform-save-btn" id="ntSaveBtn">Uložit úkol</button>
    </div>
  </div>

  <div class="modal" id="displaySettingsModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;font-size:17px;">Nastavení zobrazení</h2>
        <button id="closeDisplaySettingsBtn" style="border:1px solid var(--line-medium);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;">Zavřít</button>
      </div>
      <div class="modal-body">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">L = levý, P = pravý (na mobilu se rozdělení stran nepoužívá, jen pořadí a viditelnost) · šipky = pořadí · 👁 = skrýt/zobrazit</div>
        <div id="peopleFiltersPrehled"></div>
        <button onclick="resetPeopleLayoutToDefault()" style="margin-top:12px;font-size:13px;padding:10px 12px;background:transparent;border:1px solid var(--line-medium);color:var(--text-muted);border-radius:8px;cursor:pointer;width:100%;min-height:42px;">↺ Obnovit tovární nastavení</button>
      </div>
    </div>
  </div>

<script src="ft_loader.js"></script>
<script>
// ── Dark mode ────────────────────────────────────────────────────────────
const DARK_KEY = "ft_darkMode";
function applyDarkMode(dark) {
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem(DARK_KEY, dark ? "1" : "0");
  document.querySelectorAll(".dark-mode-btn").forEach(btn => {
    btn.textContent = dark ? "☀️" : "🌙";
  });
}
function initDarkMode() {
  const saved = localStorage.getItem(DARK_KEY);
  const dark = saved !== null ? saved === "1" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyDarkMode(dark);
}
initDarkMode();

// ── Fallback data (zobrazí se než dorazí reálná data) ───────────────────
const FALLBACK_DATA = { tasks: [], owners: [], resitele: [] };

let PEOPLE_LABELS = {};
function buildPeopleLabels(resitele) {
  PEOPLE_LABELS = {};
  (resitele || []).forEach(r => { PEOPLE_LABELS[r.zkratka] = `${r.jmeno} ${r.prijmeni}`.trim(); });
}

const STORAGE_KEY = "ftDashboardPeopleLayout"; // SDÍLENO s dashboardem a desktopovým přehledem
let DATA = JSON.parse(JSON.stringify(FALLBACK_DATA));

// ── Perzistence vybraného dne ────────────────────────────────────────────
const DAY_STATE_KEY = "ftPrehledMobileDayState";
function loadSavedDay() {
  try {
    const saved = localStorage.getItem(DAY_STATE_KEY);
    return saved ? new Date(saved + "T00:00:00") : null;
  } catch(e) { return null; }
}
function saveDayState() {
  try { localStorage.setItem(DAY_STATE_KEY, toISO(state.currentDate)); } catch(e) {}
}
const _savedDay = loadSavedDay();
const state = {
  currentDate: _savedDay || new Date(new Date().setHours(0,0,0,0)),
};

// ── Výchozí šablona rozložení lidí (stejná jako dashboard/desktop přehled) ──
const DEFAULT_PEOPLE_LAYOUT = [
  { owner: "RS",  side: "L" },
  { owner: "LR",  side: "L" },
  { owner: "DH",  side: "L" },
  { owner: "MiH", side: "L" },
  { owner: "MK",  side: "L" },
  { owner: "AMa", side: "L" },
  { owner: "MŽ",  side: "R" },
  { owner: "PL",  side: "R" },
  { owner: "JuM", side: "R" },
  { owner: "JoP", side: "R" },
  { owner: "SP",  side: "R" },
  { owner: "NP",  side: "R" },
  { owner: "MM",  side: "R" },
  { owner: "JN",  side: "R", hidden: true },
  { owner: "JK",  side: "R", hidden: true },
  { owner: "FT",  side: "R", hidden: true },
  { owner: "FCH", side: "L" },
];

function getPeopleLayout() {
  // Aktivní řešitelé = ti bez příznaku vyrazen. Vyřazení se do Přehledu
  // nezahrnují vůbec — to je oddělené od osobního skrýt/zobrazit níže.
  const activeZkratky = (DATA.resitele && DATA.resitele.length > 0)
    ? DATA.resitele.filter(r => !r.vyrazen).map(r => r.zkratka)
    : DATA.owners;

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved && Array.isArray(saved) && saved.length > 0) {
      const seen = new Set();
      return saved.filter(e => {
        if (seen.has(e.owner)) return false;
        seen.add(e.owner);
        return activeZkratky.includes(e.owner);
      });
    }
  } catch(e) {}
  const defaultOwners = DEFAULT_PEOPLE_LAYOUT.map(e => e.owner);
  const seeded = DEFAULT_PEOPLE_LAYOUT.filter(e => activeZkratky.includes(e.owner)).map(e => ({...e}));
  const missing = activeZkratky.filter(o => !defaultOwners.includes(o));
  missing.forEach((o, i) => {
    seeded.push({ owner: o, side: i < Math.ceil(missing.length / 2) ? "L" : "R" });
  });
  return seeded;
}

function savePeopleLayoutPrehled(layout) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(layout)); } catch(e) {}
}

function resetPeopleLayoutToDefault() {
  if (!confirm("Opravdu obnovit tovární nastavení? Vlastní pořadí a skrytí lidí se ztratí.")) return;
  const owners = (DATA.resitele && DATA.resitele.length > 0)
    ? DATA.resitele.filter(r => !r.vyrazen).map(r => r.zkratka)
    : (DATA.owners || []);
  const defaultOwners = DEFAULT_PEOPLE_LAYOUT.map(e => e.owner);
  const seeded = DEFAULT_PEOPLE_LAYOUT.filter(e => owners.includes(e.owner)).map(e => ({...e}));
  const missing = owners.filter(o => !defaultOwners.includes(o));
  missing.forEach((o, i) => {
    seeded.push({ owner: o, side: i < Math.ceil(missing.length / 2) ? "L" : "R" });
  });
  savePeopleLayoutPrehled(seeded);
  buildPeopleFiltersPrehled();
  renderMobileDay();
}

function openDisplaySettingsModal() {

function closeDisplaySettingsModal() {

// Na mobilu se zobrazuje JEDEN svislý seznam všech viditelných lidí (bez ohledu
// na L/P) v POŘADÍ podle layoutu — nejdřív levá strana, pak pravá, jak je uloženo.
function buildPeopleFiltersPrehled() {
  const wrap = document.getElementById("peopleFiltersPrehled");
  if (!wrap) return;
  const layout = getPeopleLayout();
  wrap.innerHTML = "";

  layout.forEach((entry, idx) => {
    const { owner, side, hidden } = entry;
    const label = PEOPLE_LABELS[owner] || owner;
    const sideOwners = layout.filter(e => e.side === side);
    const posInSide = sideOwners.indexOf(entry);

    const row = document.createElement("div");
    row.className = "person-row" + (hidden ? " is-hidden" : "");

    const upBtn = document.createElement("button");
    upBtn.className = "move-btn";
    upBtn.textContent = "↑";
    upBtn.disabled = posInSide === 0;
    upBtn.addEventListener("click", () => {
      const prevIdx = layout.slice(0, idx).map((e,i)=>({e,i})).filter(x=>x.e.side===side).pop();
      if (prevIdx !== undefined) {
        [layout[idx], layout[prevIdx.i]] = [layout[prevIdx.i], layout[idx]];
        savePeopleLayoutPrehled(layout);
        buildPeopleFiltersPrehled();
        renderMobileDay();
      }
    });

    const downBtn = document.createElement("button");
    downBtn.className = "move-btn";
    downBtn.textContent = "↓";
    downBtn.disabled = posInSide === sideOwners.length - 1;
    downBtn.addEventListener("click", () => {
      const nextIdx = layout.slice(idx+1).map((e,i)=>({e,i:i+idx+1})).filter(x=>x.e.side===side).shift();
      if (nextIdx !== undefined) {
        [layout[idx], layout[nextIdx.i]] = [layout[nextIdx.i], layout[idx]];
        savePeopleLayoutPrehled(layout);
        buildPeopleFiltersPrehled();
        renderMobileDay();
      }
    });

    const nameSpan = document.createElement("span");
    nameSpan.className = "person-name";
    nameSpan.textContent = `${owner} – ${label}`;

    const lBtn = document.createElement("button");
    lBtn.className = `side-btn ${side === "L" ? "active-L" : ""}`;
    lBtn.textContent = "L";
    lBtn.addEventListener("click", () => {
      layout[idx].side = "L";
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      renderMobileDay();
    });

    const rBtn = document.createElement("button");
    rBtn.className = `side-btn ${side === "R" ? "active-R" : ""}`;
    rBtn.textContent = "P";
    rBtn.addEventListener("click", () => {
      layout[idx].side = "R";
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      renderMobileDay();
    });

    const hideBtn = document.createElement("button");
    hideBtn.className = "hide-btn" + (hidden ? " is-hidden" : "");
    hideBtn.textContent = hidden ? "🚫" : "👁";
    hideBtn.addEventListener("click", () => {
      layout[idx].hidden = !layout[idx].hidden;
      savePeopleLayoutPrehled(layout);
      buildPeopleFiltersPrehled();
      renderMobileDay();
    });

    row.appendChild(upBtn);
    row.appendChild(downBtn);
    row.appendChild(nameSpan);
    row.appendChild(lBtn);
    row.appendChild(rBtn);
    row.appendChild(hideBtn);
    wrap.appendChild(row);
  });
}

// ── Datum helpery ────────────────────────────────────────────────────────
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
function toISO(date) { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const DAY_NAMES = ["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
function fmtDayName(date) { return DAY_NAMES[date.getDay()]; }
function fmtDate(date) {
  const d = new Date(date);
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
}

function cardClass(task) {
  const parts = ["task-card", (task.priority || "P3").toLowerCase()];
  if (task.waiting) parts.push("waiting");
  if (String(task.state || "").toLowerCase().includes("dokončeno")) parts.push("done");
  return parts.join(" ");
}
// Štítek v tag-row karty — priorita, ale "Čeká"/"Hotovo" má přednost,
// pokud nastane (stejné pořadí, jaké už řeší CSS kaskáda v components.css
// pro barvu pruhu, viz .task-card.waiting/.done deklarované AŽ za .p0-px).
function statusTag(task) {
  const isDone = String(task.state || "").toLowerCase().includes("dokončeno");
  if (isDone) return { cls: "done", label: "Hotovo" };
  if (task.waiting) return { cls: "waiting", label: "Čeká" };
  const p = (task.priority || "P3").toUpperCase();
  return { cls: p.toLowerCase(), label: p };
}
const ICON_RECUR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg>';
const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>';
const ICON_CAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/></svg>';
function escapeHtml(str) {
  return (str ?? "").toString()
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

// ── Vykreslení jednoho dne (svislý seznam osob) ─────────────────────────
function renderMobileDay() {
  document.getElementById("dayName").textContent = fmtDayName(state.currentDate);
  document.getElementById("dayDate").textContent = fmtDate(state.currentDate);

  const iso = toISO(state.currentDate);
  const dayTasks = (DATA.tasks || []).filter(t => t.plannedDate === iso);

  const byOwner = new Map();
  dayTasks.forEach(t => {
    if (!byOwner.has(t.owner)) byOwner.set(t.owner, []);
    byOwner.get(t.owner).push(t);
  });

  const layout = getPeopleLayout();
  const validOwners = (DATA.resitele && DATA.resitele.length > 0)
    ? new Set(DATA.resitele.map(r => r.zkratka))
    : new Set(DATA.owners || []);

  // Pořadí: nejdřív levá strana (v jejím pořadí), pak pravá — odpovídá tomu,
  // jak je to vidět v nastavení zobrazení.
  const people = [
    ...layout.filter(e => e.side === "L" && !e.hidden),
    ...layout.filter(e => e.side === "R" && !e.hidden),
  ].map(e => e.owner).filter(o => validOwners.has(o));

  const content = document.getElementById("content");
  content.innerHTML = "";

  if (!people.length) {
    content.innerHTML = `<div class="empty-day">Žádní lidé k zobrazení.<br>Uprav v ⚙️ Nastavení zobrazení.</div>`;
    return;
  }

  people.forEach(person => {
    const block = document.createElement("div");
    block.className = "person-block";
    const label = PEOPLE_LABELS[person] || person;
    const items = (byOwner.get(person) || []).sort((a,b) => (a.priority||"").localeCompare(b.priority||""));

    block.innerHTML = `
      <div class="person-head">
        <div class="avatar">${escapeHtml(person)}</div>
        <div>
          <div class="person-name">${escapeHtml(label)}</div>
          <div class="person-code">${escapeHtml(person)}</div>
        </div>
      </div>
      <div class="person-tasks">
        ${items.length === 0
          ? '<div class="empty-day">Žádné úkoly na tento den.</div>'
          : items.map(task => {
              const tag = statusTag(task);
              return `
            <div class="${cardClass(task)}" data-task-id="${escapeHtml(task.id || "")}">
              <div class="tag-row">
                <span class="priority-tag ${tag.cls}">${escapeHtml(tag.label)}</span>
                ${task.recurring ? `<span class="meta-tag">${ICON_RECUR} opakující se</span>` : ""}
                ${task.isMultiDay ? `<span class="meta-tag">${ICON_CALENDAR} den ${task.multiDayIndex}/${task.multiDayTotal}</span>` : ""}
              </div>
              <div class="title">${escapeHtml(task.title)}</div>
              <div class="meta">${escapeHtml(task.project || "")}</div>
              ${task.auto ? `<div class="meta meta-tag" style="margin-top:3px;">${ICON_CAR} ${escapeHtml(task.auto)}</div>` : ""}
            </div>`;
            }).join("")}
      </div>`;

    content.appendChild(block);
    block.querySelectorAll(".task-card").forEach((el, i) => {
      el.addEventListener("click", () => openModal(items[i]));
    });
  });
}

let _currentModalTask = null;

function openModal(task) {
  _currentModalTask = task;
  const chips = [
    task.priority || "Bez priority",
    task.owner || "Bez řešitele",
    task.project || "Bez projektu",
    task.state || "Bez stavu",
  ];
  if (task.auto) chips.push(`🚗 ${task.auto}`);
  if (task.recurring) chips.push("🔁 Opakující se");
  if (task.isMultiDay) chips.push(`📅 Den ${task.multiDayIndex}/${task.multiDayTotal}`);
  document.getElementById("modalChips").innerHTML = chips.map(ch => `<span class="chip">${escapeHtml(ch)}</span>`).join("");
  document.getElementById("modalTitle").textContent = `${task.id || ""} ${task.title || ""}`.trim();
  document.getElementById("modalNote").textContent = task.note || "Bez doplňující poznámky";

  const doneBtn = document.getElementById("modalDoneBtn");
  const isAlreadyDone = (task.state || "").toLowerCase().includes("dokončeno");
  if (_canWrite && task.id && !isAlreadyDone) {
    doneBtn.dataset.taskId = task.id;
    doneBtn.dataset.plannedDate = task.plannedDate || "";
    doneBtn.dataset.recurring = task.recurring ? "1" : "";
    doneBtn.dataset.multiDay = task.isMultiDay ? "1" : "";
    doneBtn.style.display = "inline-block";
  } else {
    doneBtn.style.display = "none";
  }

  // Upravit/Zrušit jen u BĚŽNÝCH úkolů (ne opakujících se/vícedenních) —
  // ty mají složitější logiku (konkrétní výskyt, ne přímý záznam) a
  // needitovaná úprava přímo na místě by mohla data zpřeházet. Pro tyhle
  // případy zůstává jen Hotovo, plnou editaci nechat na počítači.
  const editBtn = document.getElementById("modalEditBtn");
  const cancelBtn = document.getElementById("modalCancelBtn");
  const isSimpleTask = task.id && !task.recurring && !task.isMultiDay && !task.cancelled;
  editBtn.style.display = (_canWrite && isSimpleTask) ? "inline-block" : "none";
  cancelBtn.style.display = (_canWrite && isSimpleTask) ? "inline-block" : "none";

  document.getElementById("modal").classList.add("open");
}

async function markTaskAsDoneFromModal() {
  if (!_canWrite) { alert("Nemáš oprávnění označovat úkoly jako hotové."); return; }
  const btn = document.getElementById("modalDoneBtn");
  const id = btn.dataset.taskId;
  const plannedDate = btn.dataset.plannedDate;
  const isRecurring = btn.dataset.recurring === "1";
  const isMultiDay = btn.dataset.multiDay === "1";
  if (!id) return;
  btn.disabled = true;
  btn.textContent = "Ukládám…";
  try {
    const raw = FTLoader.getRawJson();
    if (!raw) throw new Error("Data ještě nejsou načtena, zkus to za chvíli znovu.");
    const user = FTLoader.getCurrentUser() || "mobilní přehled";
    // Hledat jen podle id nestačí: reálný záznam se stejným id může existovat
    // pro JINÉ datum (typicky "zástup" u opakujícího se pravidla) — takový
    // záznam nepatří k tomuto konkrétnímu výskytu, i když má stejné id.
    const rawTask = (raw.tasks || []).find(t => t.id === id);
    const task = (isRecurring && rawTask && rawTask.plannedDate !== plannedDate) ? null : rawTask;

    if (isRecurring && !task) {
      raw.dokonceni = raw.dokonceni || [];
      const already = raw.dokonceni.find(d => d.id === id && d.datum === plannedDate);
      if (!already) {
        raw.dokonceni.push({ id, datum: plannedDate, zaznamenoKym: user, zaznamenoKdy: toISO(new Date()) });
      }
      await FTLoader.saveToGitHub(raw, `Dokončení ${id} (${plannedDate}) zaznamenáno uživatelem ${user}`);
    } else if (task && isMultiDay) {
      task.completedDays = Array.isArray(task.completedDays) ? task.completedDays : [];
      if (plannedDate && !task.completedDays.includes(plannedDate)) task.completedDays.push(plannedDate);
      if (FTLoader.isMultiDayTaskFullyComplete(task)) {
        task.state = "Dokončeno";
        if (!task.doneDate) task.doneDate = toISO(new Date());
      }
      task.lastUpdated = toISO(new Date());
      await FTLoader.saveToGitHub(raw, `Den ${plannedDate} úkolu ${id} označen jako hotový uživatelem ${user}`);
    } else if (task) {
      task.state = "Dokončeno";
      if (!task.doneDate) task.doneDate = toISO(new Date());
      task.lastUpdated = toISO(new Date());
      await FTLoader.saveToGitHub(raw, `Úkol ${id} označen jako hotový uživatelem ${user}`);
    } else {
      throw new Error(`Úkol ${id} nebyl v databázi nalezen.`);
    }

    document.getElementById("modal").classList.remove("open");
    await FTLoader.reload();
  } catch (e) {
    if (e.message && e.message.includes("CONFLICT")) {
      if (confirm(`⚠ ${e.message}\n\nKliknout OK pro přenačtení dat.`)) {
        await FTLoader.reload();
      }
    } else {
      alert(`Uložení se nepodařilo: ${e.message}`);
      console.error(e);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "✓ Hotovo";
  }
}

async function saveEditedTask() {
  if (!_canWrite) { alert("Nemáš oprávnění upravovat úkoly."); return; }
  const id = document.getElementById("editTaskModal").dataset.taskId;
  if (!id) return;
  const title = (document.getElementById("et_task").value || "").trim();
  if (!title) { alert("Pole Název úkolu je povinné."); return; }

  const btn = document.getElementById("etSaveBtn");
  const setBtnState = (text, disabled) => { btn.disabled = disabled; btn.textContent = text; };
  setBtnState("Ukládám…", true);

  const maxAttempts = 3;
  try {
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const raw = FTLoader.getRawJson();
        if (!raw) throw new Error("Data ještě nejsou načtena, zkus to za chvíli znovu.");
        const task = (raw.tasks || []).find(t => t.id === id);
        if (!task) throw new Error(`Úkol ${id} nebyl v databázi nalezen (možná ho mezitím někdo smazal).`);

        task.title = title;
        task.owner = document.getElementById("et_assignee").value || "";
        task.priority = document.getElementById("et_priority").value;
        task.state = document.getElementById("et_state").value;
        task.plannedDate = document.getElementById("et_planned").value || task.plannedDate;
        task.note = (document.getElementById("et_note").value || "").trim();
        task.lastUpdated = toISO(new Date());

        const user = FTLoader.getCurrentUser() || "mobilní dashboard";
        await FTLoader.saveToGitHub(raw, `Úkol ${id} upraven z mobilu uživatelem ${user}`);
        document.getElementById("editTaskModal").classList.remove("open");
        await FTLoader.reload();
        return;
      } catch (e) {
        const isConflict = e.message && e.message.includes("CONFLICT");
        if (isConflict && attempt < maxAttempts) {
          setBtnState(`Souběžný zápis, zkouším znovu (${attempt}/${maxAttempts})…`, true);
          await FTLoader.reload();
          continue;
        }
        if (isConflict) {
          alert(`Nepodařilo se uložit ani po ${maxAttempts} pokusech kvůli opakovanému souběžnému zápisu. Zkus to prosím za chvíli znovu.`);
        } else {
          alert(`Uložení se nepodařilo: ${e.message}`);
          console.error(e);
        }
        return;
      }
    }
  } finally {
    setBtnState("Uložit změny", false);
  }
}

// ── Gesto přejetí prstem (swipe) pro přepnutí dne ───────────────────────
let touchStartX = null, touchStartY = null;
const content = document.getElementById("content");
content.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
content.addEventListener("touchend", e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Vodorovné přejetí musí být výrazně větší než svislé, ať to nekoliduje s rolováním
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) goToDay(addDays(state.currentDate, 1));  // doleva = další den
    else goToDay(addDays(state.currentDate, -1));         // doprava = předchozí den
  }
  touchStartX = null; touchStartY = null;
}, { passive: true });

// ── FTLoader integrace ───────────────────────────────────────────────────
function applyData(nextData) {
  DATA = nextData;
  DATA.resitele = DATA.resitele || [];
  DATA.owners = DATA.owners || [];
  DATA.tasks = DATA.tasks || [];
  buildPeopleLabels(DATA.resitele);
  DATA.owners.forEach(owner => { if (!PEOPLE_LABELS[owner]) PEOPLE_LABELS[owner] = owner; });
  if (_canWrite) buildAssigneeOptions();
  renderMobileDay();
}

let _canWrite = false;
let _permissionCheckedDashMobile = false;

FTLoader.init({
  onData: (parsedData) => {
    applyData(parsedData);
    if (!_permissionCheckedDashMobile) {
      _permissionCheckedDashMobile = true;
      // Mobilní Dashboard je určený pro roli Plánovač (plný zápis) — stejně
      // jako desktopový Dashboard. Operátor sem nepatří (má na to mobilní
      // Přehled s tlačítkem Hotovo), Nahlížeč taky nemá zapisovat.
      const role = FTLoader.getUserRole();
      if (role === "operator") {
        showReadOnlyRedirectMobile("Role Operátor nemá v mobilním Dashboardu přístup. Přesměrovávám na mobilní přehled…");
      } else {
        FTLoader.canActuallyWrite().then(canWrite => {
          if (!canWrite) {
            showReadOnlyRedirectMobile();
          } else {
            _canWrite = true;
            buildAssigneeOptions();
            document.getElementById("fabAddBtn").style.display = "flex";
          }
        });
      }
    }
  },
  onStatus: (msg, isError) => { console.log(msg); },
});

function showReadOnlyRedirectMobile(customMessage) {
  const div = document.createElement("div");
  div.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,0.94);z-index:10001;display:flex;align-items:center;justify-content:center;color:white;font-family:sans-serif;text-align:center;padding:20px;";
  div.innerHTML = `
    <div>
      <div style="font-size:48px;margin-bottom:16px;">🔒</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;">Nemáš oprávnění k úpravám</div>
      <div style="font-size:14px;color:var(--text-on-navy-muted);">${customMessage || "Tvůj přístup je jen pro čtení. Přesměrovávám na mobilní přehled…"}</div>
    </div>
  `;
  document.body.appendChild(div);
  setTimeout(() => { window.location.href = "tydenni_prehled_mobile.html"; }, 2500);
}

// ── Nabídka řešitelů pro formuláře (nový úkol / úprava) ──────────────────
function buildAssigneeOptions() {
  const opts = (DATA.resitele || [])
    .filter(r => !r.vyrazen)
    .map(r => `<option value="${escapeHtml(r.zkratka)}">${escapeHtml(r.zkratka)} – ${escapeHtml(r.jmeno)} ${escapeHtml(r.prijmeni)}</option>`)
    .join("");
  const ntSel = document.getElementById("nt_assignee");
  const etSel = document.getElementById("et_assignee");
  if (ntSel) ntSel.innerHTML = '<option value="">— nevybráno —</option>' + opts;
  if (etSel) etSel.innerHTML = '<option value="">— nevybráno —</option>' + opts;
}
